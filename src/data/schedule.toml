# Conference schedule.
# Each entry has a `type` and references speakers by ID (see src/data/speakers/).
# `time` is optional — omit when the program order has not yet been decided.
#
# Types:
#   keynote   — headline talk, prominent card
#   talk      — regular conference talk
#   panel     — moderator + panelists (may include TBAs)
#   lightning — grouped short community talks (no profile pages for lightning speakers)
#   break     — tea/lunch/after-party (pill)
#   meta      — registration, opening/closing remarks (pill)

# ── MORNING ──

[[schedule]]
id = "registration"
title = "Registration"
description = "Doors open at 8 AM. See you there!"
type = "meta"
time = "8:00am"

