name = "Elisa Xu"
image = "elisa-xu.jpg"
bio = """Elisa is a professional guinea pig to a toddler whose lab specialises in testing patience and boundaries. Her foray into Go began last year where she taught herself the language to land her first job as a software engineer in SafetyCulture. She has since fallen in love with the collaborative and communicative nature of building good software, and enjoys challenging the way things are done. Prior to her career switch, she was the Head of People at an Airtree company."""

[[sessions]]
title = "(Wrong) Comparison is the Thief of Joy"
kind = "talk"
description = """You've heard the old adage - comparison is the thief of joy. Indeed it is. But more specifically, wrong comparison is the thief of joy. We compare for a living. We test to see if our expectations match our realities and write hundred of lines of code to compare what we want vs what we got. Yet do we actually know what we are comparing, and what obscure test failures threaten to steal our joy?"""
