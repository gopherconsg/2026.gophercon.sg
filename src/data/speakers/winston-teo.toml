bio = """Winston Teo is Senior Director of Singpass at GovTech Singapore, where he leads Singapore’s national digital identity platform and its evolution as trusted digital infrastructure for the country. His work focuses on trust, security, platform strategy, and building resilient, user-centric public digital services at national scale.

He previously served as Director of Software Engineering Practice under GovTech’s Government Technology Office, where he drove engineering excellence, talent development, modernisation, and responsible AI adoption across teams. Before joining GovTech, Winston led R&D at Shopify Singapore, and has held engineering leadership roles across startups, scale-ups, and large technology organisations.

He is passionate about building high-performing engineering cultures, modernising complex systems, and using technology to deliver meaningful public impact."""
