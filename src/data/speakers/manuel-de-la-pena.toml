name = "Manuel de la Peña"
company = "Docker"
image = "manuel-de-la-pena.jpg"
bio = """Manuel is an OSS Software Engineer at Docker where he maintains "Testcontainers for Go". Since 2003, he has held various roles in different parts of the development process. In every job he tries to improve the quality of the software products and processes from the automation and testing point of view.

He has also founded and managed a couple of small web development and systems consulting companies. Additionally, he organises the Google Developers Group in Toledo, Spain (GDG Toledo). Manuel has delivered talks at different national and international events too.

Manuel holds a BS in Computer Science (UNED Spain), and a master degree in Research in Software Engineering and Information Systems (UNED Spain). You can find him on Internet as "mdelapenya" everywhere."""

[[sessions]]
title = "Testing GenAI applications in Go"
kind = "talk"
description = """The evolution of GenAI applications brings with it the challenge of developing testing methods that can effectively evaluate the complexity and subtlety of responses generated by advanced artificial intelligences.

This proposal involves defining detailed validation criteria and using an LLM as an "Evaluator" to determine if the responses meet the specified requirements. This approach can be applied to validate answers to specific questions, drawing on both general knowledge and especialised information.

In this session we'll leverage langchaingo to interact with LLMs, and Testcontainers Go to provision the runtime dependencies to use RAG."""
