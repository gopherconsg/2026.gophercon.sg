### Scholarships

We are happy to offer diversity scholarships to support members of underrepresented groups who may not otherwise have the opportunity to attend the conference. Please apply using [this form](https://docs.google.com/forms/d/e/1FAIpQLSdr7K62ojg90E4vEtp72-bduBJCwm7h48qfPzZnDjhIGBLamQ/viewform). Applications close on Monday, 6 January 2026 (end-of-day Singapore time).
